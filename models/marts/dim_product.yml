version: 2

models:
  - name: dim_product
    description: >
      Product dimension. One row per banking product/scheme, enriched
      with a human-readable category and CASA/Term-Deposit/Loan grouping
      derived from `schm_type` for easy slicing in the facts layer and
      BI tools.
    columns:
      - name: product_id
        description: "Primary key. Unique product identifier, e.g. PRD001."
        tests:
          - unique
          - not_null

      - name: schm_type
        description: >
          Scheme type / product category code:
          SA = Savings Account, CA = Current Account, FD = Fixed
          Deposit, RD = Recurring Deposit, LD = Loan.
        tests:
          - accepted_values:
              arguments:
                values: ['SA', 'CA', 'FD', 'RD', 'LD']

      - name: schm_code
        description: "Scheme code identifying the specific product variant, e.g. SAV001, FXD003, LON002."

      - name: product_desc
        description: "Human-readable product name/description, e.g. 'Regular Savings Account'."

      - name: product_category
        description: >
          Human-readable category derived from `schm_type`: Savings
          Account, Current Account, Fixed Deposit, Recurring Deposit,
          or Loan.
        tests:
          - accepted_values:
              arguments:
                values: ['Savings Account', 'Current Account', 'Fixed Deposit', 'Recurring Deposit', 'Loan']

      - name: product_group
        description: >
          Top-level grouping used by the KPI facts: 'CASA' (SA + CA),
          'Term Deposit' (FD + RD), or 'Loan' (LD).
        tests:
          - accepted_values:
              arguments:
                values: ['CASA', 'Term Deposit', 'Loan']

      - name: is_deposit_product
        description: "True when the product is a deposit product (SA, CA, FD, or RD)."

      - name: is_loan_product
        description: "True when the product is a loan product (LD)."

      - name: created_date
        description: "Timestamp this row was generated by dbt."
