version: 2

models:
  - name: stg_branch
    description: >
      Staged, 1:1 view of the `branch` source table. One row per physical
      bank branch. Materialized as a table and rebuilt in full on every
      run.
    columns:
      - name: branch_id
        description: "Primary key. Unique branch identifier, e.g. BR001."
        tests:
          - unique
          - not_null

      - name: province
        description: "Province in which the branch is located, e.g. Bagmati, Gandaki, Koshi."

      - name: cluster_name
        description: "Regional operating cluster the branch belongs to, e.g. Valley Cluster, Eastern Cluster."

      - name: city_name
        description: "City in which the branch is located."

      - name: branch_name
        description: "Human-readable branch name."
        tests:
          - not_null

      - name: created_date
        description: "Timestamp this staging row was generated by dbt."
        tests:
          - not_null
