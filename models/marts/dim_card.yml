version: 2

models:
  - name: dim_card
    description: >
      Card dimension. One row per debit/credit card, enriched with the
      owning account's `customer_id`, `branch_id` and `product_id` for
      easy slicing without an extra join in downstream BI tools.
    columns:
      - name: card_number
        description: "Primary key. Card number (formatted, e.g. 4643-9095-8601-8354)."
        tests:
          - unique
          - not_null

      - name: account_id
        description: "Foreign key to `stg_account.account_id`. Account the card is linked to."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_account')
                field: account_id

      - name: customer_id
        description: "Denormalized from the owning account. Foreign key to `stg_customer.cust_id`."

      - name: branch_id
        description: "Denormalized from the owning account. Foreign key to `stg_branch.branch_id`."

      - name: product_id
        description: "Denormalized from the owning account. Foreign key to `dim_product.product_id`."

      - name: card_type
        description: "Type of card: DEBIT or CREDIT."
        tests:
          - accepted_values:
              arguments:
                values: ['DEBIT', 'CREDIT']

      - name: card_balance
        description: "Current available balance / outstanding exposure on the card."

      - name: closing_balance
        description: >
          Last statement closing balance. Populated for CREDIT cards
          only; NULL for DEBIT cards.

      - name: card_expiry_date
        description: "Date the card expires."

      - name: is_expired
        description: "True when `card_expiry_date` is before the current date."

      - name: created_date
        description: "Timestamp this row was generated by dbt."
