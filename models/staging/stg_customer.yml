version: 2

models:
  - name: stg_customer
    description: >
      Staged, 1:1 view of the `customer` source table (KYC/demographic
      master data). One row per bank customer. Materialized as a table
      and rebuilt in full on every run.
    columns:
      - name: cust_id
        description: "Primary key. Unique customer identifier, e.g. C0001."
        tests:
          - unique
          - not_null

      - name: name
        description: "Customer's full legal name."
        tests:
          - not_null

      - name: address
        description: "Free-text mailing address (house no.-block, city)."

      - name: phone_number
        description: "Customer's contact phone number."

      - name: postal_code
        description: "Postal / ZIP code of the customer's address."

      - name: country
        description: "Customer's country of residence."

      - name: email
        description: "Customer's email address. Expected to be unique per customer."
        tests:
          - unique

      - name: father_name
        description: "Customer's father's name (KYC requirement)."

      - name: mother_name
        description: "Customer's mother's name (KYC requirement)."

      - name: occupation
        description: "Customer's stated occupation, e.g. Teacher, Banker, Farmer."

      - name: education
        description: >
          Highest education level attained, e.g. Primary, Secondary,
          SLC, +2, Diploma, Bachelor's, Master's, PhD.
        tests:
          - accepted_values:
              arguments:
                values: ['Primary', 'Secondary', 'SLC', '+2', 'Diploma', "Bachelor''s", "Master''s", 'PhD']

      - name: nationality
        description: "Customer's nationality."

      - name: created_date
        description: "Timestamp this staging row was generated by dbt."
        tests:
          - not_null
