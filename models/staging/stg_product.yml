version: 2

models:
  - name: stg_product
    description: >
      Staged, 1:1 view of the `product` source table. One row per banking
      product/scheme offered by the bank. The combination of `schm_type`
      and `schm_code` uniquely identifies a product; `schm_type` groups
      products into CASA/FD/RD/Loan categories. Materialized as a table
      and rebuilt in full on every run.
    columns:
      - name: product_id
        description: "Primary key. Unique product identifier, e.g. PRD001."
        tests:
          - unique
          - not_null

      - name: schm_type
        description: >
          Scheme type / product category code:
          SA = Savings Account, CA = Current Account, FD = Fixed
          Deposit, RD = Recurring Deposit, LD = Loan.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SA', 'CA', 'FD', 'RD', 'LD']

      - name: schm_code
        description: "Scheme code identifying the specific product variant, e.g. SAV001, FXD003, LON002."
        tests:
          - not_null

      - name: product_desc
        description: "Human-readable product name/description, e.g. 'Regular Savings Account'."
        tests:
          - not_null

      - name: created_date
        description: "Timestamp this staging row was generated by dbt."
        tests:
          - not_null
