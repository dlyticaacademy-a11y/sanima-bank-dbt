version: 2

models:
  - name: fct_casa_ratio
    description: >
      CASA ratio by branch and for the entire bank, computed from open
      accounts (`acct_cls_flg = 'N'`). The ratio is (CA balance + SA
      balance) / total deposit balance, rounded to 4 decimal places.
      `branch_id = 'ALL_BRANCHES'` identifies the bank-wide total row.
    columns:
      - name: branch_id
        description: >
          Foreign key to `stg_branch.branch_id`, or 'ALL_BRANCHES' for
          the bank-wide total row.
        tests:
          - not_null
          - unique

      - name: branch_name
        description: Branch name, or 'All Branches' for the bank-wide total row.

      - name: total_ca_balance
        description: Sum of open Current Account balances.

      - name: total_sa_balance
        description: Sum of open Savings Account balances.

      - name: total_fd_balance
        description: Sum of open Fixed Deposit balances.

      - name: total_rd_balance
        description: Sum of open Recurring Deposit balances.

      - name: total_deposit_balance
        description: Sum of CA, SA, FD, and RD balances.

      - name: casa_ratio
        description: CASA balance divided by total deposits, rounded to 4 decimal places; NULL when deposits are zero.

      - name: calculated_at
        description: Timestamp this row was generated by dbt.
        tests:
          - not_null
