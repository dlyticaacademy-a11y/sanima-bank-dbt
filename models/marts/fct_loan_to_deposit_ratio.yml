version: 2

models:
  - name: fct_loan_to_deposit_ratio
    description: >
      Loan-to-deposit ratio by branch and for the entire bank, computed
      from open accounts (`acct_cls_flg = 'N'`). The ratio is total loan
      outstanding / total deposit balance, rounded to 4 decimal places.
      `branch_id = 'ALL_BRANCHES'` identifies the bank-wide total row.
    columns:
      - name: branch_id
        description: >
          Foreign key to `stg_branch.branch_id`, or 'ALL_BRANCHES' for
          the bank-wide total row.
        tests:
          - not_null
          - unique

      - name: branch_name
        description: Branch name, or 'All Branches' for the bank-wide total row.

      - name: total_deposit_balance
        description: Sum of open CA, SA, FD, and RD balances.

      - name: total_loan_outstanding
        description: Positive outstanding exposure from open LD accounts.

      - name: loan_to_deposit_ratio
        description: Loan outstanding divided by total deposits, rounded to 4 decimal places; NULL when deposits are zero.

      - name: calculated_at
        description: Timestamp this row was generated by dbt.
        tests:
          - not_null
