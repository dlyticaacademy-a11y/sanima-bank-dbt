version: 2

models:
  - name: stg_card
    description: >
      Staged, 1:1 view of the `card` source table. One row per
      debit/credit card issued against an account. An account may have
      zero, one, or multiple cards. Materialized as a table and rebuilt
      in full on every run.
    columns:
      - name: card_number
        description: "Primary key. Card number (formatted, e.g. 4643-9095-8601-8354)."
        tests:
          - unique
          - not_null

      - name: account_id
        description: "Foreign key to `stg_account.account_id`. Account the card is linked to."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_account')
                field: account_id

      - name: balance
        description: "Current available balance / outstanding exposure on the card."

      - name: card_type
        description: "Type of card: DEBIT or CREDIT."
        tests:
          - accepted_values:
              arguments:
                values: ['DEBIT', 'CREDIT']

      - name: closing_balance
        description: >
          Last statement closing balance. Populated for CREDIT cards
          only; NULL for DEBIT cards.

      - name: card_expiry_date
        description: "Date the card expires."

      - name: created_date
        description: "Timestamp this staging row was generated by dbt."
        tests:
          - not_null
